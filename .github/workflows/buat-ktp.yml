name: Buat KTP Tetap
on: workflow_dispatch
jobs:
  buat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Bikin Keystore
        run: |
          keytool -genkeypair -v -keystore morphku.keystore -alias morphku -keyalg RSA -keysize 2048 -validity 10000 -storepass Morphku123 -keypass Morphku123 -dname "CN=Morphku, OU=Morphku, O=Morphku, L=Semarang, ST=Jateng, C=ID"
          echo "=== INI SHA-1 NYA, COPY YANG INI ==="
          keytool -list -v -keystore morphku.keystore -alias morphku -storepass Morphku123 | grep SHA1
          echo "=== INI BASE64 KTP-NYA, COPY SEMUA SAMPE ABIS ==="
          base64 -w 0 morphku.keystore
      - uses: actions/upload-artifact@v4
        with:
          name: morphku-keystore
          path: morphku.keystore
